<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work in Progress — Quỳnh</title>
<meta name="description" content="A mom, a marketer, and a small pile of apps that weren’t supposed to work. Two of them you can play right now with your webcam.">
<meta name="color-scheme" content="light dark">
<link rel="preload" href="fonts/playpen-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F3D3DA'/%3E%3Ctext x='16' y='24' font-size='21' text-anchor='middle' fill='%23241F1E' font-family='cursive'%3EQ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/storybook.css">
</head>
<body>

<div class="room">

  <hr class="ribbon ribbon--stripe">
  <div class="ticker" id="ticker" aria-hidden="true"></div>
  <hr class="ribbon ribbon--dots">

  <!-- ================= THE SIGN ================= -->
  <header class="sign">
    <div class="sign-left">
      <div class="stage" id="stage"
           aria-label="A tower of toy blocks spelling Quỳnh. Grab one and fling it.">
        <canvas id="c"></canvas>
      </div>
      <div class="sign-words">
        <h1 class="title" id="title"></h1>
        <p class="tagline" id="tagline"></p>
      </div>
    </div>
    <div class="sign-right">
      <button id="theme" aria-label="Toggle day and night mode">day / night</button>
    </div>
  </header>

  <!-- ================= THE DESK ================= -->
  <main class="desk" id="desk" aria-label="Everything on the desk. Pick something up."></main>

  <div class="deskfoot">
    <span class="hint">psst — click anything. or knock the blocks over.</span>
    <span id="deskfoot"></span>
  </div>

</div>

<div class="scrim" id="scrim"></div>
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-hidden="true"></div>

<script src="content/site.js"></script>
<script src="js/icons.js"></script>
<script src="js/render.js"></script>
<script src="js/blocks.js"></script>
</body>
</html>
